<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momir Vig - Random Creature Generator</title>
    <link rel="stylesheet" href="shared-common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --loading-color: #1e3c72;
            --footer-border-color: rgba(30, 60, 114, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .control-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .cmc-selector {
            margin-bottom: 20px;
        }

        .cmc-selector label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .cmc-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
            gap: 8px;
        }

        .cmc-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .cmc-btn:hover {
            border-color: #1e3c72;
            background: #f0f4f8;
        }

        .cmc-btn.active {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }

        .surprise-mode {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .surprise-mode input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .surprise-mode label {
            margin: 0;
            font-weight: 600;
            color: #856404;
            cursor: pointer;
            flex: 1;
        }

        .control-section .image-option {
            margin-bottom: 0;
        }

        .surprise-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            text-align: center;
        }

        .surprise-section.active {
            display: block;
        }

        .surprise-message {
            font-size: 24px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .surprise-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .surprise-buttons button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .surprise-buttons .print-surprise {
            background: #22c55e;
            color: white;
        }

        .surprise-buttons .print-surprise:active {
            background: #16a34a;
        }

        .surprise-buttons .reveal-btn {
            background: #667eea;
            color: white;
        }

        .surprise-buttons .reveal-btn:active {
            background: #5568d3;
        }

        .generate-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(30, 60, 114, 0.3);
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .creature-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .creature-section.active {
            display: block;
        }

        .creature-name {
            font-size: 28px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 12px;
        }

        .creature-stat {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .creature-stat .label {
            font-weight: 600;
            color: #333;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 15px 0;
        }

        .creature-text {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 6px;
            border-left: 3px solid #2a5298;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .action-btn.scryfall {
            background: #667eea;
            color: white;
        }

        .action-btn.scryfall:active {
            background: #5568d3;
        }

        .action-btn.again {
            background: #2a5298;
            color: white;
        }

        .action-btn.again:active {
            background: #1e3c72;
        }

        .action-btn.thermer {
            background: #22c55e;
            color: white;
        }

        .action-btn.thermer:active {
            background: #16a34a;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .cmc-buttons {
                grid-template-columns: repeat(7, 1fr);
            }

            .header h1 {
                font-size: 24px;
            }

            .creature-name {
                font-size: 22px;
            }

            .control-section,
            .creature-section,
            .surprise-section {
                padding: 20px;
            }

            .action-buttons,
            .surprise-buttons {
                gap: 8px;
            }

            .action-btn,
            .print-button,
            .print-surprise,
            .reveal-btn {
                padding: 16px 20px;
                font-size: 15px;
            }

            .footer {
                margin-top: 60px;
                padding: 30px 0 40px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
                <button class="hamburger-button" id="momirFilterToggle" aria-expanded="false" aria-controls="momirFilterMenu" aria-label="Abrir filtros">☰</button>
            </div>
            <h1>⚡ Momir Vig</h1>
            <p data-i18n="subtitle">Random Creature Generator</p>
            <div class="lang-switch">
                <select id="languageSelect" aria-label="Language selector">
                    <option value="pt-BR">Português (BR)</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html" data-i18n="backLink">← Voltar</a>
        </div>

        <div class="control-section">
            <div class="error" id="error"></div>

            <div class="cmc-selector">
                <label data-i18n="cmcLabel">Selecione o Custo de Mana (CMC):</label>
                <div class="cmc-buttons" id="cmcButtons"></div>
            </div>

            <div class="surprise-mode">
                <input type="checkbox" id="surpriseModeCheckbox">
                <label for="surpriseModeCheckbox" data-i18n="surpriseMode">🎁 Modo Surpresa (não revelar antes de imprimir)</label>
            </div>

            <div class="image-option mobile-hide-when-drawer">
                <input type="checkbox" id="includeImageCheckbox">
                <label for="includeImageCheckbox" data-i18n="includeImage">🖼️ Incluir Imagem na Impressão</label>
            </div>

            <div class="image-option mobile-hide-when-drawer">
                <input type="checkbox" id="imageOnlyCheckbox">
                <label for="imageOnlyCheckbox" data-i18n="imageOnly">🖼️ Somente Imagem (Scryfall)</label>
            </div>

            <div class="image-option mobile-hide-when-drawer">
                <label for="printQuantity" style="display:block; margin-bottom:8px;">Quantidade de Cópias</label>
                <input type="number" id="printQuantity" value="1" min="1" max="10" style="width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px;">
            </div>

            <div class="loading" id="loading" data-i18n="loading">
                ⏳ Buscando criatura aleatória...
            </div>

            <div id="activeFilters" style="margin-top: 15px; font-size: 14px; color: #666;"></div>

            <button class="generate-btn" id="generateBtn" disabled data-i18n="generateBtn">
                Gerar Criatura
            </button>
            <button class="action-btn again" id="repeatBtn" style="display: none; margin-top: 10px;">
                Repetir Última Busca
            </button>
        </div>

        <div class="surprise-section" id="surpriseSection">
            <div class="surprise-message" data-i18n="surpriseTitle">🎁 Criatura sorteada!</div>
            <p id="surpriseDescription" style="color: #666; margin-bottom: 20px; font-size: 14px;" data-i18n="surpriseDescription">A criatura está pronta. Clique em "Imprimir Surpresa" para revelar ao grupo!</p>

            <div class="surprise-buttons">
                <button class="print-surprise" id="printSurpriseBtn" data-i18n="printSurpriseBtn">🖨️ Imprimir Surpresa</button>
                <button class="reveal-btn" id="revealBtn" data-i18n="revealBtn">👁️ Revelar</button>
            </div>
        </div>

    <div class="creature-section" id="creatureSection">
            <img class="card-preview-image" id="creatureImage" src="" alt="Creature art">

            <div class="creature-name" id="creatureName"></div>

            <div class="creature-stat">
                <span class="label" data-i18n="labelType">Tipo:</span>
                <span id="creatureType"></span>
            </div>

            <div class="creature-stat">
                <span class="label" data-i18n="labelCMC">Custo de Mana:</span>
                <span id="creatureCMC"></span>
            </div>

            <div class="creature-stat">
                <span class="label" data-i18n="labelColors">Cores:</span>
                <span id="creatureColors"></span>
            </div>

            <div id="creatureTextContainer"></div>

            <div class="action-buttons mobile-hide-when-drawer">
                <button class="action-btn thermer" id="printBtn" data-i18n="printBtn">🖨️ Imprimir</button>
                <a class="action-btn scryfall" id="scryfallLink" target="_blank" data-i18n="viewScryfall">Ver no Scryfall</a>
                <button class="action-btn again" id="againBtn" data-i18n="generateAnother">Gerar Outra</button>
            </div>
        </div>

        <div class="footer" data-shared-footer="true" data-product-icon="⚡" data-product-name="Momir Vig"></div>
    </div>

    <div class="drawer-overlay" id="momirFilterOverlay"></div>
    <div class="filter-menu" id="momirFilterMenu" aria-hidden="true">
        <div class="filter-panel" id="momirFilterPanel">
            <div class="drawer-panel-title">⚙️ Opções Momir</div>

            <div class="filter-row">
                <label for="includeImageCheckboxMobile" data-i18n="includeImage">🖼️ Incluir Imagem na Impressão</label>
                <input type="checkbox" id="includeImageCheckboxMobile">
            </div>
            <div class="filter-row">
                <label for="imageOnlyCheckboxMobile" data-i18n="imageOnly">🖼️ Somente Imagem (Scryfall)</label>
                <input type="checkbox" id="imageOnlyCheckboxMobile">
            </div>
            <div class="filter-row" style="display:block;">
                <label for="momirSetSearch" style="display:block; margin-bottom:8px;">Sets disponíveis</label>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input id="momirSetSearch" list="momirSetSuggestions" type="text" placeholder="Digite ou selecione um set..." style="flex:1; padding:8px 10px; border:1px solid #d1d5db; border-radius:8px;" />
                    <button type="button" id="momirAddSetBtn" class="action-btn again" style="padding:8px 12px;">Adicionar</button>
                </div>
                <datalist id="momirSetSuggestions"></datalist>
                <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                    <button type="button" id="momirSelectAllSets" class="action-btn again" style="flex:1; min-width:110px; padding:8px 10px;">Marcar todos</button>
                    <button type="button" id="momirClearSets" class="action-btn thermer" style="flex:1; min-width:110px; padding:8px 10px;">Desmarcar todos</button>
                </div>
                <div id="momirSetSelectionList" style="display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;"></div>
            </div>
            <div class="filter-row">
                <label for="excludeUnsets">Excluir Un-sets</label>
                <input type="checkbox" id="excludeUnsets">
            </div>
            <div class="filter-row">
                <label for="excludeUniversesBeyond">Excluir Universes Beyond</label>
                <input type="checkbox" id="excludeUniversesBeyond">
            </div>
        </div>
    </div>

    <script src="shared-layout.js"></script>
    <script src="shared-print.js"></script>
    <script src="shared-i18n.js"></script>
    <script src="shared-card-normalizer.js"></script>
    <script>
        const API_BASE = 'https://mtg-token-printer-worker.luciano-wxc.workers.dev';
        const I18N = {
            "pt-BR": {
                subtitle: "Random Creature Generator",
                backLink: "← Voltar",
                cmcLabel: "Selecione o Custo de Mana (CMC):",
                surpriseMode: "🎁 Modo Surpresa (não revelar antes de imprimir)",
                includeImage: "🖼️ Incluir Imagem na Impressão",
                imageOnly: "🖼️ Somente Imagem (Scryfall)",
                loading: "⏳ Buscando criatura aleatória...",
                generateBtn: "Gerar Criatura",
                surpriseTitle: "🎁 Criatura sorteada!",
                surpriseDescription: "A criatura está pronta. Clique em \"Imprimir Surpresa\" para revelar ao grupo!",
                printSurpriseBtn: "🖨️ Imprimir Surpresa",
                revealBtn: "👁️ Revelar",
                labelType: "Tipo:",
                labelCMC: "Custo de Mana:",
                labelColors: "Cores:",
                printBtn: "🖨️ Imprimir",
                viewScryfall: "Ver no Scryfall",
                generateAnother: "Gerar Outra",
                errorFetchCreature: "Erro ao buscar criatura",
                colorless: "Incolor",
                notAvailable: "N/D"
            },
            en: {
                subtitle: "Random Creature Generator",
                backLink: "← Back",
                cmcLabel: "Select Mana Value (CMC):",
                surpriseMode: "🎁 Surprise Mode (do not reveal before printing)",
                includeImage: "🖼️ Include image in print",
                imageOnly: "🖼️ Image only (Scryfall)",
                loading: "⏳ Fetching random creature...",
                generateBtn: "Generate Creature",
                surpriseTitle: "🎁 Creature generated!",
                surpriseDescription: "Your creature is ready. Tap \"Print Surprise\" to reveal it to the group!",
                printSurpriseBtn: "🖨️ Print Surprise",
                revealBtn: "👁️ Reveal",
                labelType: "Type:",
                labelCMC: "Mana Value:",
                labelColors: "Colors:",
                printBtn: "🖨️ Print",
                viewScryfall: "View on Scryfall",
                generateAnother: "Generate Another",
                errorFetchCreature: "Error fetching creature",
                colorless: "Colorless",
                notAvailable: "N/A"
            }
        };
        const i18n = MTGI18n.create({
            messages: I18N,
            defaultLang: "pt-BR",
            storageKey: "mtg-lang",
        });
        const { t, applyTranslations, setupLanguageSelector } = i18n;

        let selectedCMC = null;
        let currentCreature = null;
        let lastUsedCMC = null;
        let selectedSets = [];
        let excludeUnsets = false;
        let excludeUniversesBeyond = false;
        let momirSetCatalog = [];

        const MOMIR_DEFAULT_SETS = [
            "lea","2ed","3ed","4bb","4ed","5ed","6ed","7ed","8ed","9ed","10e","m10","m11","m12","m13","m14","m15","m19","m20","m21","m22","m23","m24","m25","war","mid","one","woe","vow","otj","thb","eld","afr","znr","ori","ravn","dmu","snc","dsk","ltr","mh1","mh2","mh3","moc","mom","sld","cmm","hbg","cmb","pca"
        ];

        let allMomirSetCodes = [...MOMIR_DEFAULT_SETS];

        function getMomirSetMetaLabel(setCode, setName) {
            const code = String(setCode || '').toUpperCase();
            if (!setName) return code;
            return `${setName} (${code})`;
        }

        function sortSetCatalog(setCatalog) {
            return [...setCatalog].sort((a, b) => {
                const aTime = a && a.released_at ? new Date(a.released_at).getTime() : 0;
                const bTime = b && b.released_at ? new Date(b.released_at).getTime() : 0;
                return bTime - aTime || String(a?.name || '').localeCompare(String(b?.name || ''));
            });
        }

        function ensureSelectedSetsCurrent() {
            if (!selectedSets) {
                selectedSets = [...allMomirSetCodes];
            }
            selectedSets = selectedSets
                .map((code) => String(code).toLowerCase())
                .filter((code, index, arr) => arr.indexOf(code) === index)
                .filter((code) => allMomirSetCodes.includes(code));
        }

        function renderMomirSetSelectionList(setCatalog) {
            const selectionList = document.getElementById('momirSetSelectionList');
            const datalist = document.getElementById('momirSetSuggestions');
            const searchInput = document.getElementById('momirSetSearch');
            if (!selectionList || !datalist) return;

            const catalog = sortSetCatalog(setCatalog || momirSetCatalog || []);
            const uniqueCatalog = catalog.filter((set, index, arr) => {
                const code = String(set?.code || '').toLowerCase();
                return code && arr.findIndex((item) => String(item?.code || '').toLowerCase() === code) === index;
            });

            momirSetCatalog = uniqueCatalog;
            allMomirSetCodes = uniqueCatalog.map((set) => String(set.code).toLowerCase());
            ensureSelectedSetsCurrent();

            datalist.innerHTML = '';
            selectionList.innerHTML = '';

            const query = (searchInput?.value || '').trim().toLowerCase();

            uniqueCatalog.forEach((set) => {
                const code = String(set.code).toLowerCase();
                const setLabel = getMomirSetMetaLabel(code, set.name);
                const matches = !query || code.includes(query) || set.name.toLowerCase().includes(query) || setLabel.toLowerCase().includes(query);

                const option = document.createElement('option');
                option.value = code.toUpperCase();
                option.label = setLabel;
                option.style.display = matches ? '' : 'none';
                datalist.appendChild(option);

                const row = document.createElement('label');
                row.dataset.setCode = code;
                row.style.display = matches ? 'flex' : 'none';
                row.style.alignItems = 'center';
                row.style.gap = '8px';
                row.style.padding = '6px 8px';
                row.style.border = '1px solid #e5e7eb';
                row.style.borderRadius = '8px';
                row.style.background = '#f8fafc';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = selectedSets.includes(code);
                checkbox.addEventListener('change', () => {
                    const current = new Set(selectedSets);
                    if (checkbox.checked) current.add(code);
                    else current.delete(code);
                    selectedSets = [...current];
                    if (selectedSets.length === 0) {
                        selectedSets = [...allMomirSetCodes];
                    }
                    saveFilterState();
                });

                const label = document.createElement('span');
                label.textContent = setLabel;
                row.appendChild(checkbox);
                row.appendChild(label);
                selectionList.appendChild(row);
            });

            saveFilterState();

            if (!selectionList.children.length) {
                const empty = document.createElement('div');
                empty.textContent = 'Nenhum set encontrado';
                empty.style.color = '#6b7280';
                empty.style.padding = '8px 0';
                selectionList.appendChild(empty);
            }
        }

        function addSelectedMomirSet() {
            const input = document.getElementById('momirSetSearch');
            if (!input) return;

            const typedValue = input.value.trim().toLowerCase();
            if (!typedValue) return;

            const matches = momirSetCatalog.find((set) => {
                const code = String(set.code).toLowerCase();
                const name = String(set.name || '').toLowerCase();
                return code === typedValue || code.includes(typedValue) || name.includes(typedValue) || `${name} ${code}`.includes(typedValue);
            });
            if (!matches) return;

            const code = String(matches.code).toLowerCase();
            if (!selectedSets.includes(code)) {
                selectedSets.push(code);
            }

            input.value = '';
            renderMomirSetSelectionList(momirSetCatalog);
            saveFilterState();
        }

        function selectAllMomirSets() {
            selectedSets = [...allMomirSetCodes];
            renderMomirSetSelectionList(momirSetCatalog);
            saveFilterState();
        }

        function clearAllMomirSets() {
            selectedSets = [];
            renderMomirSetSelectionList(momirSetCatalog);
            saveFilterState();
        }

        function syncMomirSetSelectionFilter() {
            const searchInput = document.getElementById('momirSetSearch');
            const datalist = document.getElementById('momirSetSuggestions');
            const selectionList = document.getElementById('momirSetSelectionList');
            if (!searchInput || !datalist || !selectionList) return;

            const query = searchInput.value.trim().toLowerCase();
            Array.from(datalist.options).forEach((option) => {
                const matches = !query || option.value.toLowerCase().includes(query) || option.label.toLowerCase().includes(query);
                option.style.display = matches ? '' : 'none';
            });

            Array.from(selectionList.querySelectorAll('[data-set-code]')).forEach((row) => {
                const code = row.dataset.setCode || '';
                const label = row.textContent || '';
                const matches = !query || code.includes(query) || label.toLowerCase().includes(query);
                row.style.display = matches ? 'flex' : 'none';
            });
        }

        async function populateMomirSetSelect() {
            const select = document.getElementById('momirSetsSelect');
            const searchInput = document.getElementById('momirSetSearch');
            const addBtn = document.getElementById('momirAddSetBtn');
            const selectAllBtn = document.getElementById('momirSelectAllSets');
            const clearBtn = document.getElementById('momirClearSets');
            if (!select) {
                const fallbackCatalog = MOMIR_DEFAULT_SETS.map((code) => ({ code, name: code.toUpperCase(), released_at: null }));
                selectedSets = [...MOMIR_DEFAULT_SETS];
                allMomirSetCodes = [...MOMIR_DEFAULT_SETS];
                momirSetCatalog = fallbackCatalog;
                renderMomirSetSelectionList(fallbackCatalog);
            }

            try {
                const response = await fetch(`${API_BASE}/api/sets`);
                if (!response.ok) throw new Error('Unable to load sets from worker');

                const data = await response.json();
                const catalog = (data.sets || [])
                    .filter((set) => set && set.code && set.name)
                    .map((set) => ({
                        code: String(set.code).toLowerCase(),
                        name: set.name,
                        released_at: set.released_at,
                    }))
                    .filter((set, index, arr) => arr.findIndex((item) => item.code === set.code) === index);

                if (catalog.length === 0) throw new Error('No valid sets returned');

                const sortedCatalog = sortSetCatalog(catalog);
                allMomirSetCodes = sortedCatalog.map((set) => set.code);
                selectedSets = [...allMomirSetCodes];
                momirSetCatalog = sortedCatalog;
                renderMomirSetSelectionList(sortedCatalog);
            } catch (error) {
                const fallbackCatalog = MOMIR_DEFAULT_SETS.map((code) => ({ code, name: code.toUpperCase(), released_at: null }));
                allMomirSetCodes = [...MOMIR_DEFAULT_SETS];
                selectedSets = [...allMomirSetCodes];
                momirSetCatalog = fallbackCatalog;
                renderMomirSetSelectionList(fallbackCatalog);
            }

            if (searchInput) {
                searchInput.addEventListener('input', syncMomirSetSelectionFilter);
            }
            if (addBtn) {
                addBtn.addEventListener('click', addSelectedMomirSet);
            }
            if (selectAllBtn) {
                selectAllBtn.addEventListener('click', selectAllMomirSets);
            }
            if (clearBtn) {
                clearBtn.addEventListener('click', clearAllMomirSets);
            }
            document.getElementById('excludeUnsets').addEventListener('change', saveFilterState);
            document.getElementById('excludeUniversesBeyond').addEventListener('change', saveFilterState);
        }

        function getFilterSelections() {
            return {
                setCodes: selectedSets.length ? selectedSets : [...allMomirSetCodes],
                excludeUnsets: document.getElementById('excludeUnsets').checked,
                excludeUniversesBeyond: document.getElementById('excludeUniversesBeyond').checked,
            };
        }

        function parseFilterState() {
            ensureSelectedSetsCurrent();
            excludeUnsets = document.getElementById('excludeUnsets').checked;
            excludeUniversesBeyond = document.getElementById('excludeUniversesBeyond').checked;
        }

        function updateActiveFiltersSummary() {
            const summaryEl = document.getElementById('activeFilters');
            if (!summaryEl) return;

            const parts = [];
            if (selectedSets.length > 0 && selectedSets.length < allMomirSetCodes.length) {
                parts.push(`${selectedSets.length} sets selecionados`);
            }
            if (excludeUnsets) {
                parts.push('excluindo Un-sets');
            }
            if (excludeUniversesBeyond) {
                parts.push('excluindo Universes Beyond');
            }

            summaryEl.textContent = parts.length > 0 ? `Filtros ativos: ${parts.join(' • ')}` : '';
        }

        function saveFilterState() {
            const state = {
                selectedSets,
                excludeUnsets,
                excludeUniversesBeyond,
                selectedCMC,
            };
            localStorage.setItem('momirFilterState', JSON.stringify(state));
            updateActiveFiltersSummary();
        }

        function loadFilterState() {
            const savedState = localStorage.getItem('momirFilterState');
            if (savedState) {
                const state = JSON.parse(savedState);
                selectedSets = state.selectedSets || [];
                excludeUnsets = state.excludeUnsets || false;
                excludeUniversesBeyond = state.excludeUniversesBeyond || false;
                selectedCMC = state.selectedCMC;

                document.getElementById('excludeUnsets').checked = excludeUnsets;
                document.getElementById('excludeUniversesBeyond').checked = excludeUniversesBeyond;
                if (selectedCMC !== null) {
                    selectCMC(selectedCMC);
                }
            }
        }

        // Initialize CMC buttons
        function initCMCButtons() {
            const container = document.getElementById('cmcButtons');
            for (let i = 0; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'cmc-btn';
                btn.textContent = i;
                btn.dataset.cmc = i;
                btn.addEventListener('click', () => selectCMC(i));
                container.appendChild(btn);
            }
        }

        function selectCMC(cmc) {
            selectedCMC = cmc;
            document.querySelectorAll('.cmc-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-cmc="${cmc}"]`).classList.add('active');
            document.getElementById('generateBtn').disabled = false;
            saveFilterState();
        }

        async function generateCreature() {
            if (selectedCMC === null) return;

            const errorEl = document.getElementById('error');
            const loadingEl = document.getElementById('loading');
            const creatureEl = document.getElementById('creatureSection');
            const surpriseEl = document.getElementById('surpriseSection');
            const isSurpriseMode = document.getElementById('surpriseModeCheckbox').checked;
            parseFilterState();

            errorEl.classList.remove('active');
            loadingEl.classList.add('active');
            creatureEl.classList.remove('active');
            surpriseEl.classList.remove('active');

            try {
                const params = new URLSearchParams({
                    cmc: String(selectedCMC),
                });

                if (selectedSets.length) {
                    params.set('sets', selectedSets.join(','));
                }
                if (excludeUnsets) params.set('exclude_unsets', 'true');
                if (excludeUniversesBeyond) params.set('exclude_universes_beyond', 'true');

                const response = await fetch(`${API_BASE}/api/momir?${params.toString()}`);

                if (!response.ok) {
                    throw new Error(`${t("errorFetchCreature")}: ${response.status}`);
                }

                const creature = await response.json();
                lastUsedCMC = selectedCMC;
                document.getElementById('repeatBtn').style.display = 'block';

                if (isSurpriseMode) {
                    currentCreature = creature;
                    surpriseEl.classList.add('active');
                } else {
                    displayCreature(creature);
                }
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.add('active');
            } finally {
                loadingEl.classList.remove('active');
            }
        }

        function displayCreature(creature) {
            const section = document.getElementById('creatureSection');
            const view = MTGCardNormalizer.normalizeMomirCard(creature, {
                colorlessLabel: t('colorless'),
                notAvailableLabel: t('notAvailable'),
            });

            // Image
            document.getElementById('creatureImage').src = view.imageUrl || '';
            document.getElementById('creatureImage').style.display = view.imageUrl ? 'block' : 'none';

            // Name
            document.getElementById('creatureName').textContent = view.name;

            // Type
            document.getElementById('creatureType').textContent = view.typeLine;

            // CMC
            document.getElementById('creatureCMC').textContent = view.manaValue ?? '0';

            // Colors
            document.getElementById('creatureColors').textContent = view.colorsText || t('colorless');

            // Oracle text
            const textContainer = document.getElementById('creatureTextContainer');
            textContainer.innerHTML = '';
            if (view.rulesText) {
                const textEl = document.createElement('div');
                textEl.className = 'creature-text';
                textEl.textContent = view.rulesText;
                textContainer.appendChild(textEl);
            }

            // Scryfall link
            document.getElementById('scryfallLink').href = view.scryfallUrl || '#';

            // Store current creature for printing
            currentCreature = creature;

            section.classList.add('active');
        }

        function printWithThermer() {
            if (!currentCreature) return;

            const includeImage = document.getElementById('includeImageCheckbox').checked;
            const imageOnly = document.getElementById('imageOnlyCheckbox').checked;
            const quantity = parseInt(document.getElementById('printQuantity').value, 10) || 1;
            
            const endpoint = MTGPrint.resolveCardPrintEndpoint({
                apiBase: API_BASE,
                cardId: currentCreature.id,
                cardName: currentCreature.name,
                includeImage,
                imageOnly,
                quantity,
            });

            MTGPrint.launchThermerPrint({ endpoint });
        }

        function revealSurprise() {
            if (!currentCreature) return;
            
            // Switch to normal creature display
            document.getElementById('surpriseSection').classList.remove('active');
            displayCreature(currentCreature);
        }

        function printSurprise() {
            if (!currentCreature) return;
            
            const includeImage = document.getElementById('includeImageCheckbox').checked;
            const imageOnly = document.getElementById('imageOnlyCheckbox').checked;
            const quantity = parseInt(document.getElementById('printQuantity').value, 10) || 1;
            
            const endpoint = MTGPrint.resolveCardPrintEndpoint({
                apiBase: API_BASE,
                cardId: currentCreature.id,
                cardName: currentCreature.name,
                includeImage,
                imageOnly,
                quantity,
            });

            MTGPrint.launchThermerPrint({ endpoint });
        }

        function syncSurpriseMobileActions() {
            const surpriseActive = document.getElementById('surpriseSection').classList.contains('active');
            const surpriseMobile = document.getElementById('surpriseMobileActions');
            if (surpriseMobile) {
                surpriseMobile.style.display = surpriseActive ? 'flex' : 'none';
            }
        }

        function setupMobileFilterMenu() {
            const filterToggle = document.getElementById('momirFilterToggle');
            const filterMenu = document.getElementById('momirFilterMenu');
            const filterOverlay = document.getElementById('momirFilterOverlay');
            const includeDesktop = document.getElementById('includeImageCheckbox');
            const imageOnlyDesktop = document.getElementById('imageOnlyCheckbox');
            const includeMobile = document.getElementById('includeImageCheckboxMobile');
            const imageOnlyMobile = document.getElementById('imageOnlyCheckboxMobile');

            function syncFromDesktopToMobile() {
                includeMobile.checked = includeDesktop.checked;
                imageOnlyMobile.checked = imageOnlyDesktop.checked;
            }

            function syncFromMobileToDesktop() {
                includeDesktop.checked = includeMobile.checked;
                imageOnlyDesktop.checked = imageOnlyMobile.checked;
            }

            function closeDrawer() {
                filterMenu.classList.remove('open');
                filterOverlay.classList.remove('open');
                filterToggle && filterToggle.setAttribute('aria-expanded', 'false');
                filterMenu.setAttribute('aria-hidden', 'true');
            }

            function openDrawer() {
                filterMenu.classList.add('open');
                filterOverlay.classList.add('open');
                filterToggle && filterToggle.setAttribute('aria-expanded', 'true');
                filterMenu.setAttribute('aria-hidden', 'false');
            }

            if (filterToggle) {
                filterToggle.addEventListener('click', () => {
                    const expanded = filterToggle.getAttribute('aria-expanded') === 'true';
                    expanded ? closeDrawer() : openDrawer();
                });
            }

            includeDesktop.addEventListener('change', syncFromDesktopToMobile);
            imageOnlyDesktop.addEventListener('change', syncFromDesktopToMobile);
            includeMobile.addEventListener('change', syncFromMobileToDesktop);
            imageOnlyMobile.addEventListener('change', syncFromMobileToDesktop);

            filterOverlay && filterOverlay.addEventListener('click', closeDrawer);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeDrawer();
            });
        }

        // Event listeners
        document.getElementById('generateBtn').addEventListener('click', generateCreature);
        document.getElementById('againBtn').addEventListener('click', generateCreature);
        document.getElementById('momirFilterToggle').addEventListener('click', () => {
            const menu = document.getElementById('momirFilterMenu');
            const overlay = document.getElementById('momirFilterOverlay');
            const isOpen = menu.classList.contains('open');
            if (isOpen) {
                menu.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                menu.classList.add('open');
                overlay.classList.add('open');
            }
        });
        document.getElementById('momirFilterOverlay').addEventListener('click', () => {
            const menu = document.getElementById('momirFilterMenu');
            const overlay = document.getElementById('momirFilterOverlay');
            menu.classList.remove('open');
            overlay.classList.remove('open');
        });

        // Initialize
        loadFilterState();
        initCMCButtons();
        populateMomirSetSelect();
    </script>
</body>
</html>
