<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Designer</title>
  <link rel="stylesheet" href="token-designer.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <a href="index.html" class="back-link">← Voltar</a>
        <div>
          <p class="eyebrow">Ferramenta isolada</p>
          <h1>Token Designer</h1>
        </div>
      </div>
    </header>

    <main class="designer-layout">
      <aside class="toolbar" aria-label="Ferramentas de desenho">
        <div class="tool-group">
          <button class="tool-btn active" data-tool="pen" title="Lápis" aria-label="Lápis">✏️</button>
          <button class="tool-btn" data-tool="line" title="Linha" aria-label="Linha">／</button>
          <button class="tool-btn" data-tool="rect" title="Retângulo" aria-label="Retângulo">▭</button>
          <button class="tool-btn" data-tool="circle" title="Círculo" aria-label="Círculo">◯</button>
          <button class="tool-btn" data-tool="triangle" title="Triângulo" aria-label="Triângulo">△</button>
          <button class="tool-btn" data-tool="eraser" title="Borracha" aria-label="Borracha">␡</button>
          <button class="tool-btn" data-tool="text" title="Texto" aria-label="Texto">T</button>
        </div>

        <div class="panel-block">
          <label for="lineWidth">Espessura</label>
          <input id="lineWidth" type="range" min="2" max="20" value="4" />
        </div>

        <div class="panel-block">
          <label>Tonalidade</label>
          <div class="swatches" aria-label="Paleta de cores">
            <button class="swatch active" data-color="#111827" style="background:#111827" title="Preto"></button>
            <button class="swatch" data-color="#000000" style="background:#000000" title="Preto total"></button>
            <button class="swatch" data-color="#374151" style="background:#374151" title="Cinza escuro"></button>
            <button class="swatch" data-color="#6b7280" style="background:#6b7280" title="Cinza"></button>
            <button class="swatch" data-color="#9ca3af" style="background:#9ca3af" title="Cinza claro"></button>
            <button class="swatch" data-color="#ffffff" style="background:#ffffff; border:1px solid #d1d5db" title="Branco"></button>
          </div>
        </div>

        <div class="panel-block actions-block">
          <input id="printQuantity" type="number" min="1" max="10" value="1" title="Quantidade de cópias" aria-label="Quantidade de cópias" />
          <button id="thresholdBtn" class="action-btn secondary" title="Alternar threshold P&B" aria-label="Alternar threshold P&B">◐</button>
          <button id="printThermerBtn" class="action-btn thermer" title="Imprimir na Thermer" aria-label="Imprimir na Thermer">🖨️</button>
          <button id="undoBtn" class="action-btn secondary" title="Desfazer" aria-label="Desfazer">↶</button>
          <button id="clearBtn" class="action-btn danger" title="Limpar canvas" aria-label="Limpar canvas">⌫</button>
          <button id="downloadBtn" class="action-btn primary" title="Exportar PNG" aria-label="Exportar PNG">⬇️</button>
          <div class="android-hint" id="androidThermerHint">
            ⚠️ Se o app não abrir automaticamente no Android, abra o Thermer manualmente e tente novamente.
          </div>
        </div>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-wrap">
          <canvas id="tokenCanvas" width="720" height="720" aria-label="Canvas do token"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="shared-print.js"></script>
  <script src="token-designer.js"></script>
</body>
</html>
